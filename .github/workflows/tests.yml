# Tests of the DBE-P toolkit and the toy consumer (see CLAUDE.md, "Checks before you finish").
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:                       # a new push to a branch cancels the run still going on it
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -c "import jax; print('jax', jax.__version__, jax.devices())"
      - run: python -m pytest -q -p no:cacheprovider
      - name: Toy back-end and consumer (finite-difference errors)
        run: python examples/example_oscillator.py
